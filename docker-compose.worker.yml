services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: worker-agent
    ports:
      - "${WORKER_HTTP_PORT:-8001}:8001"
      - "${WORKER_GRPC_PORT:-50052}:50052"
    env_file:
      - .env
    environment:
      MASTER_GRPC_URL: "${MASTER_GRPC_URL}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      WORKER_MODEL: "${WORKER_MODEL:-gemma4:latest}"
      WORKER_MAX_CONCURRENT: "${WORKER_MAX_CONCURRENT:-4}"
      HEARTBEAT_INTERVAL: "${HEARTBEAT_INTERVAL:-5}"
      WORKER_HTTP_PORT: "${WORKER_HTTP_PORT:-8001}"
      WORKER_GRPC_PORT: "${WORKER_GRPC_PORT:-50052}"
    restart: unless-stopped
