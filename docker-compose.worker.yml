services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    ports:
      - "${WORKER_HTTP_PORT}:${WORKER_HTTP_PORT}"
      - "${WORKER_GRPC_PORT}:${WORKER_GRPC_PORT}"
    environment:
      - MASTER_GRPC_URL
      - OLLAMA_URL
      - WORKER_MODEL
      - WORKER_MAX_CONCURRENT
      - HEARTBEAT_INTERVAL
      - WORKER_HTTP_PORT
      - WORKER_GRPC_PORT
