services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    ports:
      - "${WORKER_HTTP_PORT}:${WORKER_HTTP_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MASTER_HTTP_URL: "${MASTER_HTTP_URL}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      WORKER_MODEL: "${WORKER_MODEL:-llama3.1:8b}"
      HEARTBEAT_INTERVAL: "${HEARTBEAT_INTERVAL:-2}"
      WORKER_HTTP_PORT: "${WORKER_HTTP_PORT:-8001}"
      WORKER_ADVERTISE_HOST: "${WORKER_ADVERTISE_HOST:-}"
