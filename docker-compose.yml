version: "3.9"

services:
  master:
    build:
      context: .
      dockerfile: master/Dockerfile
    ports:
      - "${MASTER_HTTP_PORT:-8000}:8000"
      - "${MASTER_GRPC_PORT:-50051}:50051"
    environment:
      MASTER_HTTP_PORT: "${MASTER_HTTP_PORT:-8000}"
      MASTER_GRPC_PORT: "${MASTER_GRPC_PORT:-50051}"
      SCHEDULING_STRATEGY: "${SCHEDULING_STRATEGY:-load_aware}"
      MAX_RETRIES: "${MAX_RETRIES:-3}"
      TASK_TIMEOUT: "${TASK_TIMEOUT:-120}"
      HEARTBEAT_TIMEOUT: "${HEARTBEAT_TIMEOUT:-15}"
      MAX_QUEUE_SIZE: "${MAX_QUEUE_SIZE:-5000}"
    volumes:
      - ./monitoring:/monitoring
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/targets.json:/etc/prometheus/targets.json:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - master

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

# ── To join the cluster from a worker laptop ──────────────────────────────────
#
# macOS / Windows (Docker Desktop):
#   docker run -d \
#     -p 8001:8001 -p 50052:50052 \
#     -e MASTER_GRPC_URL=<master-lan-ip>:50051 \
#     -e OLLAMA_URL=http://host.docker.internal:11434 \
#     -e WORKER_MODEL=llama3.2:1b \
#     -e WORKER_MAX_CONCURRENT=4 \
#     --name worker-agent \
#     distributed-ai-worker
#
# Linux:
#   docker run -d \
#     --network=host \
#     -e MASTER_GRPC_URL=<master-lan-ip>:50051 \
#     -e OLLAMA_URL=http://localhost:11434 \
#     -e WORKER_MODEL=llama3.2:1b \
#     -e WORKER_MAX_CONCURRENT=4 \
#     --name worker-agent \
#     distributed-ai-worker
