services:
  master:
    build:
      context: .
      dockerfile: master/Dockerfile
    command:
      - "python3"
      - "-m"
      - "uvicorn"
      - "master.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${MASTER_HTTP_PORT}"
    environment:
      - MASTER_HTTP_PORT
      - SCHEDULING_STRATEGY
      - MAX_RETRIES
      - TASK_TIMEOUT
      - HEARTBEAT_TIMEOUT
      - HEALTH_CHECK_INTERVAL
      - MAX_QUEUE_SIZE
      - RAG_ENABLED
      - RAG_TOP_K
      - RAG_DOCS_DIR
      - RAG_DB_DIR
    volumes:
      - ./monitoring:/monitoring
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['MASTER_HTTP_PORT'] + '/health')\""]
      interval: "${MASTER_HEALTHCHECK_INTERVAL}"
      timeout: "${MASTER_HEALTHCHECK_TIMEOUT}"
      retries: ${MASTER_HEALTHCHECK_RETRIES}

  nginx:
    image: nginx:alpine
    ports:
      - "${MASTER_HTTP_PORT}:80"
    environment:
      - MASTER_HTTP_PORT
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - master

  prometheus:
    image: "${PROMETHEUS_IMAGE}"
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/targets.json:/etc/prometheus/targets.json:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=0.0.0.0:${PROMETHEUS_PORT}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - master

  grafana:
    image: "${GRAFANA_IMAGE}"
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED
      - GF_AUTH_ANONYMOUS_ORG_ROLE
      - GF_SECURITY_ADMIN_PASSWORD
      - GF_SERVER_HTTP_PORT
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

# ── To join the cluster from a worker laptop ──────────────────────────────────
#
# Configure worker values in .env, then run:
#   docker compose -f docker-compose.worker.yml up --build
